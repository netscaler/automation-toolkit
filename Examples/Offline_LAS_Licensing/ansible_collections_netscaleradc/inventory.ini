[netscalers]
# Each entry is a logical name for a NetScaler. The module connects to the
# appliance via the NITRO API and SFTP using the host vars below, not via SSH.
#
# Required per-host variables:
#   nsip             - Management IP of the NetScaler ADC appliance
#   nitro_user       - Must be "nsroot"
#   nitro_pass       - nsroot password
#   entitlement_name - License entitlement name as listed in LAS customer entitlements
#                      Format: "<platform> <model> <edition>" e.g. "VPX 10000 Premium"
#                      See README for valid model prefixes and editions.
#   las_secrets_json - Absolute path to las_secrets.json on the control node
#
# Optional per-host variables:
#   nitro_protocol  - http or https (default: https)
#   validate_certs  - true or false (default: false)
#   is_fips         - true or false for FIPS VPX appliances (default: false)

# VPX example
ns_vpx_1  nsip=10.0.0.10  nitro_user=nsroot  nitro_pass=<nsroot_password>  entitlement_name="VPX 10000 Premium"       las_secrets_json=/path/to/las_secrets.json

# MPX example
ns_mpx_1  nsip=10.0.0.20  nitro_user=nsroot  nitro_pass=<nsroot_password>  entitlement_name="MPX 8905 Premium"        las_secrets_json=/path/to/las_secrets.json

# VPX FIPS example
ns_fips_1 nsip=10.0.0.30  nitro_user=nsroot  nitro_pass=<nsroot_password>  entitlement_name="FIPS VPX 5000 Premium"  is_fips=true  las_secrets_json=/path/to/las_secrets.json
