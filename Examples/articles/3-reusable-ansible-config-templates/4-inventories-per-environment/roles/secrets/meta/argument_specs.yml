---
argument_specs:
  main:
    short_description: Read one environment's NetScaler credentials from GCP Secret Manager
    description:
      - Sets the ns_username and ns_password facts, consumed by module_defaults.
    options:
      secrets_gcp_project:
        type: str
        required: true
        description: GCP project holding the secrets
      secrets_ns_username_secret:
        type: str
        required: true
        description: Secret Manager secret name for the NetScaler username
      secrets_ns_password_secret:
        type: str
        required: true
        description: Secret Manager secret name for the NetScaler password
      secrets_service_account_file:
        type: str
        description: Path to the GCP service account key
      secrets_version:
        type: str
        description: Secret version to read
