---
# Each environment passes its own secret names, so dev never holds a production password.
- name: "Secrets | Read {{ secrets_ns_username_secret }} and {{ secrets_ns_password_secret }} from Secret Manager"
  ansible.builtin.set_fact:
    ns_username: "{{ lookup('google.cloud.gcp_secret_manager', key=secrets_ns_username_secret,
                     version=secrets_version, project=secrets_gcp_project,
                     auth_kind='serviceaccount', service_account_file=secrets_service_account_file) }}"
    ns_password: "{{ lookup('google.cloud.gcp_secret_manager', key=secrets_ns_password_secret,
                     version=secrets_version, project=secrets_gcp_project,
                     auth_kind='serviceaccount', service_account_file=secrets_service_account_file) }}"
  no_log: true
