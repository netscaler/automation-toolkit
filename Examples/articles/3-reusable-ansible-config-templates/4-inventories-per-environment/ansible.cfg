[defaults]
# No default inventory on purpose: every run names its environment with -i,
# so nothing reaches prod by accident.
roles_path = roles
# -i inventories/<env> loads every file in the folder; skip the committed hosts.yml.example
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .example
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
