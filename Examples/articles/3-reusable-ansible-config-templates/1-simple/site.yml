---
# Use case 1 - Simple: one playbook, one NetScaler, credentials in the inventory.
#   ansible-playbook site.yml --check --diff   # dry run: what would change
#   ansible-playbook site.yml                  # apply
- name: "1-simple | Configure load balancing on NetScaler"
  hosts: netscaler
  gather_facts: false

  # Connection details for every netscaler.adc module in this play
  module_defaults:
    group/netscaler.adc.default_args:
      nsip: "{{ nsip }}"
      nitro_user: "{{ ns_username }}"
      nitro_pass: "{{ ns_password }}"
      nitro_protocol: https
      # The appliance still presents its default certificate
      validate_certs: false

  tasks:
    - name: Build the service group member list from the backend IP addresses
      ansible.builtin.set_fact:
        servicegroup_members: "{{ servicegroup_members | default([]) + [member] }}"
      vars:
        member:
          servicegroupname: kk-ans-test-servicegroup
          ip: "{{ item }}"
          port: 80
          weight: 1
      loop: "{{ apps_private_ip_addresses }}"

    - name: Create the service group and bind the backend members
      netscaler.adc.servicegroup:
        state: present
        servicegroupname: kk-ans-test-servicegroup
        servicetype: HTTP
        clttimeout: 40
        servicegroup_servicegroupmember_binding:
          # desired: members that are not in the list are unbound
          mode: desired
          binding_members: "{{ servicegroup_members }}"

    - name: Create the load balancing vserver and bind the service group
      netscaler.adc.lbvserver:
        state: present
        name: kk-ans-test-lb
        ipv46: "{{ netscaler_private_vip }}"
        port: 80
        servicetype: HTTP
        lbmethod: ROUNDROBIN
        lbvserver_servicegroup_binding:
          mode: desired
          binding_members:
            - name: kk-ans-test-lb
              servicename: kk-ans-test-servicegroup
